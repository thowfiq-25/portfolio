<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Education cover image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081015"/>
      <stop offset="1" stop-color="#0c1f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00b8e6" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Abstract "book" -->
  <g transform="translate(160 150)">
    <path d="M0 80c120-60 240-60 360 0v260c-120-60-240-60-360 0V80z" fill="rgba(255,255,255,0.06)" stroke="rgba(0,212,255,0.25)" stroke-width="2"/>
    <path d="M360 80c120-60 240-60 360 0v260c-120-60-240-60-360 0V80z" fill="rgba(0,0,0,0.22)" stroke="rgba(0,212,255,0.25)" stroke-width="2"/>
    <rect x="20" y="120" width="300" height="14" rx="7" fill="url(#accent)"/>
    <rect x="20" y="160" width="260" height="12" rx="6" fill="rgba(232,247,255,0.28)"/>
    <rect x="20" y="190" width="220" height="12" rx="6" fill="rgba(232,247,255,0.22)"/>

    <rect x="400" y="120" width="300" height="14" rx="7" fill="url(#accent)" opacity="0.9"/>
    <rect x="400" y="160" width="260" height="12" rx="6" fill="rgba(232,247,255,0.28)"/>
    <rect x="400" y="190" width="220" height="12" rx="6" fill="rgba(232,247,255,0.22)"/>
  </g>

  <!-- Title -->
  <g font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif">
    <text x="160" y="100" font-size="52" fill="#ffffff" font-weight="800">Education</text>
    <text x="160" y="145" font-size="22" fill="rgba(255,255,255,0.75)">Highlights " Scores " Academic performance</text>
  </g>
</svg>
